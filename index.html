body{position:relative;isolation:isolate}

.logo{animation:logoPulse 3s ease-in-out infinite}

.fps-number{animation:fpsGlow 2.5s ease-in-out infinite}
.bar{transform-origin:bottom;animation:grow 1s ease-out both,barPulse 2s ease-in-out infinite alternate}
.bar:nth-child(2n){animation-delay:.15s,.3s}
.bar:nth-child(3n){animation-delay:.3s,.6s}
.card{position:relative;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:linear-gradient(120deg,transparent 15%,#50e8ff12 50%,transparent 85%);transform:translateX(-100%);transition:opacity .3s}
.card:hover::before{opacity:1;animation:cardShine .8s ease}
.card:hover .icon{transform:translateY(-3px) scale(1.06);box-shadow:0 0 24px #9b6bff25}
.icon{transition:transform .25s,box-shadow .25s}
.primary{box-shadow:0 0 25px #50e8ff20;transition:transform .2s,box-shadow .2s,filter .2s}
.primary:hover{box-shadow:0 0 25px #50e8ff40,0 0 45px #9b6bff30;filter:brightness(1.12)}
.cta{position:relative;overflow:hidden}

@keyframes logoPulse{0%,100%{box-shadow:0 0 18px #9065ff35}50%{box-shadow:0 0 32px #50e8ff65}}
@keyframes badgeGlow{0%,100%{border-color:#9b6bff66}50%{border-color:#50e8ff99}}
@keyframes gradientFlow{to{background-position:200% center}}
@keyframes auraPulse{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.15);opacity:1}}
@keyframes fpsGlow{0%,100%{text-shadow:0 0 18px #50e8ff35}50%{text-shadow:0 0 25px #50e8ff90,0 0 45px #50e8ff35}}
@keyframes barPulse{from{filter:brightness(.75)}to{filter:brightness(1.35)}}
@keyframes cardShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes ctaShine{from{transform:translateX(-35%)}to{transform:translateX(35%)}}

try{lang=localStorage.getItem("lang")||(((navigator.language||"").toLowerCase().indexOf("km")===0)?"km":"en");}catch(e){}
function el(i){return document.getElementById(i)}
function apply(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-k]").forEach(function(e){var v=T[lang][e.getAttribute("data-k")];if(v)e.textContent=v;});
  document.querySelectorAll(".lang button").forEach(function(b){b.className=(b.getAttribute("data-l")===lang)?"on":"";});
  el("ver").textContent=latest?"· "+T[lang].latest+latest:"";
}
document.querySelectorAll(".lang button").forEach(function(b){
  b.onclick=function(){lang=b.getAttribute("data-l");try{localStorage.setItem("lang",lang);}catch(e){}apply();};
});
apply();

  var a=(j.assets||[]).filter(function(x){return /\.apk$/i.test(x.name);})[0];
  if(a)el("dl").href=a.browser_download_url;
  latest=j.tag_name||"";apply();
}).catch(function(){});

el("year").textContent=new Date().getFullYear();
var revealObserver=new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    if(entry.isIntersecting){entry.target.classList.add("visible");revealObserver.unobserve(entry.target);}
  });
},{threshold:0.12});
document.querySelectorAll(".reveal").forEach(function(e){revealObserver.observe(e);});
